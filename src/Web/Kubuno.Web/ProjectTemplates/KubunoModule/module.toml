[module]
id           = "$moduleid$"
display_name = "$moduletitle$"
version      = "0.1.0"
description  = "A Kubuno module."
author       = "Kubuno Contributors"
license      = "AGPL-3.0"
homepage_url = "https://github.com/kubuno/$moduleid$"
runtime      = "rust"

[process]
entrypoint = "$cratename$"
args       = []

[server]
host = "127.0.0.1"
# Pick a free port in the platform's allocation table before shipping (core 8080, drive 3101, calendar 3102...
# books 3121, stt 3122, p2pnas 3123, build 3124 are taken).
port = 3199

[routes]
patterns = [
    { method = "*", path = "/*" },
]

[[sidebar_items]]
id       = "$moduleid$"
label    = "$moduletitle$"
icon     = "Puzzle"
path     = "/$moduleid$"
position = 50
section  = "main"

[events]
subscribed = []
publishes  = []
