[package]
name = "$cratename$"
version = "0.1.0"
edition = "2021"

[dependencies]
# Kubuno, the one dependency of a Kubuno desktop application (`kubuno_desktop::prelude`, `#[kubuno_desktop::view]`,
# `kubuno_desktop::Application`), taken from a local checkout of github.com/kubuno/core (its `desktop`
# Cargo workspace, the framework's Windows crates in `desktop/windows`). The path was resolved when this
# project was created: the KUBUNO_DESKTOP_SRC environment variable if it was set, else the default
# `Z:\src\core` (or a former kubuno/desktop checkout in `Z:\src\desktop`). To use another checkout,
# change it here AND <KubunoDesktopCrates> in the .rsproj (which stops the build with a clear message when
# that folder is missing). The released framework is also available by git tag:
# `kubuno-desktop = { git = "https://github.com/kubuno/core", tag = "desktop-v..." }`.
#
# Kubuno's UI library is linked statically: the built exe needs no DLL beside it. This project builds
# into its OWN target directory, apart from the desktop workspace's (the .rsproj - see its comment).
kubuno-desktop = { path = "$kubunodesktopcrates$/kubuno-desktop" }
