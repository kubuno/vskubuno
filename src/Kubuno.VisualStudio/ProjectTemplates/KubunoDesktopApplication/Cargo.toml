[package]
name = "$cratename$"
version = "0.1.0"
edition = "2021"

[dependencies]
# Kubuno, the one dependency of a Kubuno desktop application (`kubuno::prelude`, `#[kubuno::view]`,
# `kubuno::Application`), taken from a local checkout of github.com/kubuno/desktop (its `windows`
# Cargo workspace). The path was resolved when this project was created: the KUBUNO_DESKTOP_SRC
# environment variable if it was set, else the default `Z:\src\desktop\windows`. To use another
# checkout, change it here AND <KubunoDesktopSrc> in the .rsproj (which stops the build with a clear
# message when that folder is missing). Once the crates publish git tags, this becomes
# `kubuno = { git = "https://github.com/kubuno/desktop", tag = "..." }`.
#
# Kubuno's UI library is a Rust dylib (`kubuno_ui.dll`): this project must build into its OWN target
# directory, never into the desktop workspace's (the .rsproj takes care of it - see its comment).
kubuno = { path = "$kubunodesktopsrc$/src/crates/kubuno" }
