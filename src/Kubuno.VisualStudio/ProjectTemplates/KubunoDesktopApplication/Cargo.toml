[package]
name = "$cratename$"
version = "0.1.0"
edition = "2021"

[dependencies]
# The Kubuno desktop crates, taken from a local checkout of github.com/kubuno/desktop (its `windows`
# Cargo workspace). The path below was resolved when this project was created: the
# KUBUNO_DESKTOP_SRC environment variable if it was set, else the default `Z:\src\desktop\windows`.
# To use another checkout, change the three paths below AND <KubunoDesktopSrc> in the .rsproj (the
# .rsproj checks that folder before building and stops with a clear message if it is missing).
# Once these crates publish git tags, they become `git = "https://github.com/kubuno/desktop", tag = "..."`.
#
# `kubuno-ui` is a Rust dylib (`kubuno_ui.dll`): this project must build into its OWN target directory,
# never into the desktop workspace's (the .rsproj takes care of it - see its comment).
kubuno-ui       = { path = "$kubunodesktopsrc$/src/crates/kubuno-ui" }
kubuno-controls = { path = "$kubunodesktopsrc$/src/crates/kubuno-controls" }
kubuno-views    = { path = "$kubunodesktopsrc$/src/crates/kubuno-views" }
