[package]
name = "$cratename$"
version = "0.1.0"
edition = "2021"
description = "A Kubuno module."
license = "AGPL-3.0"

[dependencies]
# Shared crate, distributed as a tagged git dependency (CLAUDE.md section 3) - never path/vendored.
# A module never links "core" directly.
kubuno-seccomp = { git = "https://github.com/kubuno/core", tag = "seccomp-v0.1.1", package = "kubuno-seccomp" }

axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "set-header", "cors"] }
# Postgres only, matching CLAUDE.md's stack ("PostgreSQL 16, schema dedicated per module"). Real
# Kubuno modules additionally support MySQL/SQLite through the shared kubuno-db crate (see e.g.
# notes/tasks's own Cargo.toml) - left out here to keep this template buildable with no extra
# dependency; add kubuno-db the same way as kubuno-seccomp above if you need that abstraction.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "migrate", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
toml = "0.8"
