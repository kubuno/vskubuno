[module]
id           = "$moduleid$"
display_name = "$safeprojectname$"
version      = "0.1.0"
description  = "A Kubuno module."
author       = "Kubuno Contributors"
license      = "AGPL-3.0"
homepage_url = "https://github.com/kubuno/$moduleid$"
runtime      = "rust"
dependencies = []

[process]
entrypoint = "$cratename$"
args       = []

[server]
host = "127.0.0.1"
# Placeholder: pick a free port from vskubuno/../CLAUDE.md section 2's allocation table before
# shipping (drive 3101, calendar 3102, ... the table lists every port already taken).
port = 3199

[routes]
patterns = [
    { method = "*", path = "/*" },
]

[[sidebar_items]]
id       = "$moduleid$"
label    = "$safeprojectname$"
icon     = "Puzzle"
path     = "/$moduleid$"
position = 50
section  = "main"

[events]
subscribed = []
publishes  = []
