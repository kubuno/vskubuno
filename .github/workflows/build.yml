name: Build

on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: microsoft/setup-msbuild@v2

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0
            10.0

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: rust-analyzer,rust-src,clippy,rustfmt

      # kubuno-views-ls.exe (Kubuno.Views' language server, tools\kubuno-views-ls.exe
      # in the VSIX) lives in the separate kubuno/desktop repo, not here - see
      # src/Views/Kubuno.Views/INTEGRATION.md #6 and Kubuno.VisualStudio.csproj's
      # KubunoViewsLsExePath property. Checked out to a sibling path and built before the solution
      # build below, which is pointed at its output via /p:KubunoViewsLsExePath.
      - name: Checkout kubuno/desktop (for kubuno-views-ls)
        uses: actions/checkout@v4
        with:
          repository: kubuno/desktop
          path: desktop

      - name: Build kubuno-views-ls
        working-directory: desktop/windows
        run: cargo build --release -p kubuno-desktop-views-ls

      - name: NuGet Restore
        run: nuget restore Kubuno.VisualStudio.sln

      - name: Build Solution
        # KubunoViewsLsExePath: see the cargo build step above (default cargo target dir under
        # desktop/windows/target, since CARGO_TARGET_DIR is left unset here).
        # kubuno-vs-mcp.exe needs no property override: Kubuno.Shared.Mcp is now part of this solution
        # (ReferenceOutputAssembly=false ProjectReference from Kubuno.VisualStudio.csproj), so this
        # one build also produces it at Kubuno.VisualStudio.csproj's own KubunoMcpOutputDir default.
        run: >-
          msbuild Kubuno.VisualStudio.sln /p:Configuration=Release /p:DeployExtension=false
          /p:KubunoViewsLsExePath=${{ github.workspace }}\desktop\windows\target\release\kubuno-views-ls.exe

      - name: Discover and Run Tests
        shell: pwsh
        run: |
          $testProjects = Get-ChildItem -Path "tests" -Filter "*.csproj" -Recurse
          foreach ($project in $testProjects) {
            Write-Host "Running tests for $($project.FullName)"
            dotnet test "$($project.FullName)" --configuration Release --no-build
          }

      - name: Upload VSIX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kubuno.VisualStudio.vsix
          path: src/Kubuno.VisualStudio/bin/Release/Kubuno.VisualStudio.vsix

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: src/Kubuno.VisualStudio/bin/Release/Kubuno.VisualStudio.vsix
          body: See CHANGELOG.md for details.
